<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="robots" content="{{robots}}">
<link rel="canonical" href="{{canonical}}">
<meta name="theme-color" content="#f7fafc" media="(prefers-color-scheme: light)">

<meta name="twitter:image" content="{{image}}">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" href="/fonts/geist.woff2" as="font" type="font/woff2" crossorigin>
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}document.documentElement.classList.add('js')</script>
<style>{{css}}</style>

<header class="header" data-header>
  <div class="wrap header-inner">
    <a class="brand" href="/" aria-label="LedgerFly home">

      <span>LedgerFly</span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="/#features">Features</a>
      <a href="/#how">How it works</a>
      <a href="/self-hosting/">Self-hosting</a>
      <a href="/apps/">Apps</a>
      <a href="/#faq">FAQ</a>
    </nav>
    <div class="header-actions">
      <button class="icon-btn" type="button" data-theme-toggle aria-label="Switch between light and dark theme">
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>

      </button>
      <a class="btn btn-soft btn-sm hide-sm" href="{{repo}}" rel="noopener">GitHub</a>
      <a class="btn btn-primary btn-sm" href="/self-hosting/">Get started</a>
      <button class="icon-btn menu-btn" type="button" data-menu aria-label="Open menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </div>
</header>
<main id="main">
{{content}}
</main>

  <div class="wrap">

        <span>LedgerFly</span>

        <a href="/#features">Features</a>
        <a href="/self-hosting/">Self-hosting</a>

        <a href="{{repo}}/issues" rel="noopener">Issues</a>
